name: Rust-Go Interop (2.6.4)

on:
  push:
    paths:
      - 'go/**'
      - 'go.work'
      - 'easytier/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - '.github/workflows/interop.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'go/**'
      - 'go.work'
      - 'easytier/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - '.github/workflows/interop.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-go:
    name: Build Go + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build -o /tmp/easytier-core-go ./cmd/easytier-core && go build -o /tmp/easytier-cli-go ./cmd/easytier-cli
      # P4 gate: the race-enabled unit suite is blocking (SE §8.1).
      - name: Test with race detector
        run: go test -race ./...
      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: /tmp/easytier-core-go
          retention-days: 7
          if-no-files-found: warn

  build-oracle:
    name: Fetch Rust 2.6.4 oracle (release binaries)
    runs-on: ubuntu-latest
    steps:
      # The oracle is exactly the upstream 2.6.4 release: download the
      # prebuilt linux x64 binaries instead of compiling the Rust core.
      - name: Download oracle release binaries
        run: |
          set -euo pipefail
          curl -fsSL -o oracle.zip \
            https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-linux-x86_64-v2.6.4.zip
          mkdir oracle-bin
          unzip -o oracle.zip -d oracle-bin
          find oracle-bin -type f | head -n 20
          mkdir -p dist
          find oracle-bin -type f \( -name easytier-core -o -name easytier-cli \) -exec mv {} dist/ \;
          ls -l dist
      - name: Upload oracle binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-oracle-2.6.4
          path: dist/easytier-*
          retention-days: 7
          if-no-files-found: error

  fixture-corpus:
    name: Fixture corpus (go/testdata/compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase scope: the committed corpus is the source of truth and is
      # verified by the Go golden tests in build-go. Rust regeneration is
      # deferred to a dedicated nightly/dispatch job when needed.
      - name: Verify corpus is committed
        run: |
          echo "Corpus contents:"
          find go/testdata/compat -type f | head -n 50
          if [ -n "$(git status --porcelain go/testdata/compat)" ]; then
            echo "::error::go/testdata/compat has uncommitted changes"
            git status -- go/testdata/compat
            exit 1
          fi
      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: compat-corpus
          path: go/testdata/compat
          retention-days: 7
          if-no-files-found: warn

  # P4: golden-vector regeneration against the Rust oracle, on demand only
  # (workflow_dispatch) because it compiles the Rust core (~10-20 min).
  # A diff means either the corpus must be re-committed or a §11 migration
  # record is required (docs/GO_REWRITE_SE.md).
  fixture-regen:
    name: Regenerate corpus from oracle (dispatch only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust 2.6.4 oracle source
        run: |
          git init oracle
          git -C oracle remote add origin https://github.com/EasyTier/EasyTier.git
          git -C oracle fetch --depth=1 origin 8428a89d2dabc94c97d370ec607c6ca142473626
          git -C oracle checkout --detach FETCH_HEAD
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          pnpm: false
          gui: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: regen-2.6.4
          prefix-key: interop
          workspaces: oracle
      - name: Generate corpus from the oracle
        run: |
          set -euo pipefail
          mkdir -p go/testdata/compat/packet go/testdata/compat/handshake go/testdata/compat/digest go/testdata/compat/noise go/testdata/compat/secure go/testdata/compat/config go/testdata/compat/rpc go/testdata/compat/route go/testdata/compat/wg
          if cargo run --manifest-path tools/gen-fixtures/Cargo.toml -- --out go/testdata/compat 2>/dev/null; then
            echo "gen-fixtures (tools/gen-fixtures) succeeded"
          else
            echo "::warning::tools/gen-fixtures unavailable; corpus left as committed"
          fi
      - name: Diff regenerated corpus
        run: |
          if [ -n "$(git status --porcelain go/testdata/compat)" ]; then
            echo "::warning::Regenerated corpus differs from the committed one — review and either re-commit or record a §11 migration"
            git diff --stat -- go/testdata/compat || true
            git diff -- go/testdata/compat | head -n 200 || true
          else
            echo "Regenerated corpus is byte-identical to the committed corpus"
          fi
      - name: Upload regenerated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-corpus-regen
          path: go/testdata/compat
          retention-days: 7
          if-no-files-found: warn

  interop-matrix:
    name: Interop ${{ matrix.transport }} / ${{ matrix.security }} (${{ matrix.direction }})${{ matrix.feature && format(' / {0}', matrix.feature) || '' }}
    runs-on: ubuntu-latest
    # Phase scope: cells are informational until the wire-protocol gaps
    # (peer-center, QUIC, routing interop) are closed; the aggregate gate
    # only requires the builds.
    continue-on-error: true
    needs: [build-go, build-oracle, fixture-corpus]
    strategy:
      fail-fast: false
      matrix:
        include:
          # VAL-02 full matrix: TCP/UDP/WS/WG/QUIC × legacy/noise_xx × both directions (+ relay/compression).
          - transport: tcp
            security: legacy
            direction: go_to_rust
            feature: ""
          - transport: tcp
            security: legacy
            direction: rust_to_go
            feature: ""
          - transport: tcp
            security: noise_xx
            direction: go_to_rust
            feature: ""
          - transport: tcp
            security: noise_xx
            direction: rust_to_go
            feature: ""
          - transport: udp
            security: legacy
            direction: go_to_rust
            feature: ""
          - transport: udp
            security: legacy
            direction: rust_to_go
            feature: ""
          - transport: udp
            security: noise_xx
            direction: go_to_rust
            feature: ""
          - transport: udp
            security: noise_xx
            direction: rust_to_go
            feature: ""
          - transport: ws
            security: legacy
            direction: go_to_rust
            feature: ""
          - transport: ws
            security: legacy
            direction: rust_to_go
            feature: ""
          - transport: ws
            security: noise_xx
            direction: go_to_rust
            feature: ""
          - transport: ws
            security: noise_xx
            direction: rust_to_go
            feature: ""
          - transport: wg
            security: legacy
            direction: go_to_rust
            feature: ""
          - transport: wg
            security: legacy
            direction: rust_to_go
            feature: ""
          - transport: wg
            security: noise_xx
            direction: go_to_rust
            feature: ""
          - transport: wg
            security: noise_xx
            direction: rust_to_go
            feature: ""
          - transport: quic
            security: legacy
            direction: go_to_rust
            feature: ""
          - transport: quic
            security: legacy
            direction: rust_to_go
            feature: ""
          - transport: quic
            security: noise_xx
            direction: go_to_rust
            feature: ""
          - transport: quic
            security: noise_xx
            direction: rust_to_go
            feature: ""
          # Relay dimension: 3-node A--B--C where A and C are not directly connected but via B as relay (legacy + noise, all transports, both directions)
          - transport: tcp
            security: legacy
            direction: go_to_rust
            feature: relay
          - transport: tcp
            security: legacy
            direction: rust_to_go
            feature: relay
          - transport: tcp
            security: noise_xx
            direction: go_to_rust
            feature: relay
          - transport: tcp
            security: noise_xx
            direction: rust_to_go
            feature: relay
          - transport: udp
            security: legacy
            direction: go_to_rust
            feature: relay
          - transport: udp
            security: legacy
            direction: rust_to_go
            feature: relay
          - transport: udp
            security: noise_xx
            direction: go_to_rust
            feature: relay
          - transport: udp
            security: noise_xx
            direction: rust_to_go
            feature: relay
          - transport: ws
            security: legacy
            direction: go_to_rust
            feature: relay
          - transport: ws
            security: legacy
            direction: rust_to_go
            feature: relay
          - transport: ws
            security: noise_xx
            direction: go_to_rust
            feature: relay
          - transport: ws
            security: noise_xx
            direction: rust_to_go
            feature: relay
          - transport: wg
            security: legacy
            direction: go_to_rust
            feature: relay
          - transport: wg
            security: legacy
            direction: rust_to_go
            feature: relay
          - transport: wg
            security: noise_xx
            direction: go_to_rust
            feature: relay
          - transport: wg
            security: noise_xx
            direction: rust_to_go
            feature: relay
          - transport: quic
            security: legacy
            direction: go_to_rust
            feature: relay
          - transport: quic
            security: legacy
            direction: rust_to_go
            feature: relay
          - transport: quic
            security: noise_xx
            direction: go_to_rust
            feature: relay
          - transport: quic
            security: noise_xx
            direction: rust_to_go
            feature: relay
          # Compression dimension: zstd vs none interop (peer with zstd can interoperate with one without compression)
          - transport: tcp
            security: legacy
            direction: go_to_rust
            feature: compressed
          - transport: tcp
            security: legacy
            direction: rust_to_go
            feature: compressed
          - transport: tcp
            security: noise_xx
            direction: go_to_rust
            feature: compressed
          - transport: tcp
            security: noise_xx
            direction: rust_to_go
            feature: compressed
          - transport: udp
            security: legacy
            direction: go_to_rust
            feature: compressed
          - transport: udp
            security: legacy
            direction: rust_to_go
            feature: compressed
          - transport: udp
            security: noise_xx
            direction: go_to_rust
            feature: compressed
          - transport: udp
            security: noise_xx
            direction: rust_to_go
            feature: compressed
          - transport: ws
            security: legacy
            direction: go_to_rust
            feature: compressed
          - transport: ws
            security: legacy
            direction: rust_to_go
            feature: compressed
          - transport: ws
            security: noise_xx
            direction: go_to_rust
            feature: compressed
          - transport: ws
            security: noise_xx
            direction: rust_to_go
            feature: compressed
          - transport: wg
            security: legacy
            direction: go_to_rust
            feature: compressed
          - transport: wg
            security: legacy
            direction: rust_to_go
            feature: compressed
          - transport: wg
            security: noise_xx
            direction: go_to_rust
            feature: compressed
          - transport: wg
            security: noise_xx
            direction: rust_to_go
            feature: compressed
          - transport: quic
            security: legacy
            direction: go_to_rust
            feature: compressed
          - transport: quic
            security: legacy
            direction: rust_to_go
            feature: compressed
          - transport: quic
            security: noise_xx
            direction: go_to_rust
            feature: compressed
          - transport: quic
            security: noise_xx
            direction: rust_to_go
            feature: compressed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: go/go.sum
      - name: Install Rust 1.95 (for oracle binary reuse)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: /tmp
      - name: Download oracle binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-oracle-2.6.4
          path: /tmp
      - name: Prepare binaries
        run: chmod +x /tmp/easytier-core* /tmp/easytier-cli* 2>/dev/null || true; ls -l /tmp
      - name: Run interop cell
        env:
          RUST_ORACLE_CORE: /tmp/easytier-core
          RUST_ORACLE_CLI: /tmp/easytier-cli
          GO_CORE: /tmp/easytier-core-go
          TRANSPORT: ${{ matrix.transport }}
          SECURITY: ${{ matrix.security }}
          DIRECTION: ${{ matrix.direction }}
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail
          CELL="${TRANSPORT}_${SECURITY}_${DIRECTION}"
          if [ -n "${FEATURE:-}" ]; then CELL="${CELL}_${FEATURE}"; fi
          echo "Interop cell: $CELL (transport=$TRANSPORT security=$SECURITY direction=$DIRECTION feature=${FEATURE:-<direct>})"
          echo "Oracle: $RUST_ORACLE_CORE, Go: $GO_CORE"
          # Golden-vector gate always runs (PR2)
          (cd go && GOWORK=off go test -race -run TestGolden ./... 2>&1 | head -n 100)
          # Per-cell integration: requires -tags=interop tests that start both nodes on 127.0.0.1:0
          # Failures are visible: the matrix is informational (continue-on-error),
          # but a red cell must read as red instead of silently passing.
          if (cd go && GOWORK=off go test -tags=interop -run TestInterop/${CELL} ./... 2>&1); then
            echo "Cell passed"
          else
            echo "::error::Interop cell $CELL failed or is not implemented — see docs/GO_REWRITE_TODOLIST.md §7.4"
            exit 1
          fi
      - name: Upload packet capture on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pcap-${{ matrix.transport }}-${{ matrix.security }}-${{ matrix.direction }}${{ matrix.feature && format('-{0}', matrix.feature) || '' }}
          path: /tmp/*.pcap
          retention-days: 7
          if-no-files-found: ignore

  interop-result:
    name: Interop result
    runs-on: ubuntu-latest
    needs: [build-go, build-oracle, fixture-corpus, fixture-regen, interop-matrix]
    if: always()
    steps:
      - name: Aggregate
        run: |
          echo "build-go: ${{ needs.build-go.result }}"
          echo "build-oracle: ${{ needs.build-oracle.result }}"
          echo "fixture-corpus: ${{ needs.fixture-corpus.result }}"
          echo "fixture-regen: ${{ needs.fixture-regen.result }}"
          echo "interop-matrix: ${{ needs.interop-matrix.result }}"
          # P4 gate: the linux x64 build AND the race-enabled unit suite
          # must pass. The oracle fetch, corpus check, dispatch-only
          # regeneration and the interop matrix are informational until the
          # remaining deep-interop gaps close (see REWRITE_PROGRESS_TODO.md).
          if [ "${{ needs.build-go.result }}" != "success" ]; then
            echo "::error::build-go failed — build + race tests are the phase gate"
            exit 1
          fi
          if [ "${{ needs.build-oracle.result }}" != "success" ] || [ "${{ needs.fixture-corpus.result }}" != "success" ]; then
            echo "::notice::oracle fetch or corpus job did not succeed; interop cells may be incomplete"
          fi
