name: EasyTier GUI

on:
  push:
    branches: ["develop", "main", "feature", "releases/**"]
    paths:
      - "easytier-gui/**"
      - "easytier-web/frontend-lib/**"
      - "go/gui/**"
      - "go/internal/gui/**"
      - "go/platform/**"
      - ".github/workflows/gui.yml"
  pull_request:
    branches: ["develop", "main", "feature"]
    paths:
      - "easytier-gui/**"
      - "easytier-web/frontend-lib/**"
      - "go/gui/**"
      - "go/internal/gui/**"
      - "go/platform/**"
      - ".github/workflows/gui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - OS: windows-latest
            ARTIFACT_NAME: windows-x86_64
            OUTPUT_NAME: easytier-gui.exe
            GOOS: windows
            GOARCH: amd64
          - OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64
            OUTPUT_NAME: easytier-gui
            GOOS: linux
            GOARCH: amd64

    runs-on: ${{ matrix.OS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: go/go.sum

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter easytier-frontend-lib build
          pnpm --filter easytier-gui build

      - name: Copy Frontend Assets to Go GUI
        shell: bash
        run: |
          mkdir -p go/gui/dist
          cp -r easytier-gui/dist/* go/gui/dist/

      - name: Build Go GUI Application
        shell: bash
        run: |
          cd go/gui
          mkdir -p ../../dist/artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -v -ldflags "-s -w -H windowsgui" -o "../../dist/artifacts/${{ matrix.OUTPUT_NAME }}" .
          else
            go build -v -ldflags "-s -w" -o "../../dist/artifacts/${{ matrix.OUTPUT_NAME }}" .
          fi

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-gui-${{ matrix.ARTIFACT_NAME }}
          path: dist/artifacts/*
          if-no-files-found: error
