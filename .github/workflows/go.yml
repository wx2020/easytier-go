name: Go

on:
  push:
    paths:
      - 'go/**'
      - 'go.work'
      - 'docs/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'go.work'
      - 'docs/**'
      - '.github/workflows/go.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: go/go.sum
      - name: Check formatting
        working-directory: .
        run: |
          gofmt -d $(git ls-files '*.go') > /tmp/gofmt.diff
          if [ -s /tmp/gofmt.diff ]; then
            cat /tmp/gofmt.diff
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build native binaries
        run: go build ./cmd/easytier-core ./cmd/easytier-cli
      # P4 gate: the race-enabled unit suite is blocking (SE §8.1); the
      # previously flaky suites (WG session surfacing, peer-center digest)
      # are fixed and covered by golden vectors.
      - name: Test with race detector
        run: go test -race ./...

  cross-build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Phase scope: linux x64 only. Re-add windows/darwin/arm64 targets
          # when the rewrite leaves the build-verification phase.
          - goos: linux
            goarch: amd64
            extension: ''
    defaults:
      run:
        working-directory: go
    env:
      CGO_ENABLED: 0
      GOWORK: off
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: go/go.sum
      - name: Build easytier-core
        run: go build -o "easytier-core${{ matrix.extension }}" ./cmd/easytier-core
      - name: Build easytier-cli
        run: go build -o "easytier-cli${{ matrix.extension }}" ./cmd/easytier-cli
