name: Go Release (FND-05)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v2.6.4); defaults to VERSION file / tag"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.25.0"

jobs:
  # Gate: vet + race before any release build
  gate:
    name: Gate (vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test with race
        run: go test -race ./...

  build:
    name: Build ${{ matrix.artifact }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported 2.6.4 matrix (README.md / GO_REWRITE_TODOLIST.md §5).
          # Deferred targets are intentionally absent: placeholders must not
          # be published as release assets.
          - goos: linux
            goarch: amd64
            goarm: ""
            artifact: linux-amd64
          - goos: linux
            goarch: arm64
            goarm: ""
            artifact: linux-arm64
          - goos: freebsd
            goarch: amd64
            goarm: ""
            artifact: freebsd-amd64
          - goos: windows
            goarch: amd64
            goarm: ""
            artifact: windows-amd64
          - goos: windows
            goarch: 386
            goarm: ""
            artifact: windows-386

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="v$(cat VERSION 2>/dev/null || echo "2.6.4")"
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v$VER"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build (reproducible)
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOWORK: off
          GOFLAGS: -trimpath
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          LDFLAGS="-s -w -buildid= -X main.version=v${{ steps.version.outputs.version }} -X main.commit=${COMMIT}"
          echo "Building easytier-core / easytier-cli GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM version=v${{ steps.version.outputs.version }}"
          mkdir -p dist/build
          go -C go build -trimpath -ldflags "$LDFLAGS" -o ../dist/build/easytier-core${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/easytier-core
          go -C go build -trimpath -ldflags "$LDFLAGS" -o ../dist/build/easytier-cli${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/easytier-cli
          ls -lh dist/build/
          # Normalize mtimes for reproducibility
          find dist/build -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +

      - name: Package (reproducible archive)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          ART="easytier-go-v${VER}-${{ matrix.artifact }}"
          STAGE="dist/package/$ART"
          mkdir -p "$STAGE"
          cp dist/build/* "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          mkdir -p "$STAGE/LICENSES"
          cp LICENSES/LGPL-3.0-only.txt "$STAGE/LICENSES/" 2>/dev/null || true
          cp README.md "$STAGE/" 2>/dev/null || true
          find "$STAGE" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          mkdir -p dist/artifacts
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd "$STAGE" && zip -X -r "$GITHUB_WORKSPACE/dist/artifacts/${ART}.zip" . >/dev/null)
            echo "artifact=dist/artifacts/${ART}.zip" >> "$GITHUB_ENV"
          else
            (cd "$STAGE" && tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -czf "$GITHUB_WORKSPACE/dist/artifacts/${ART}.tar.gz" .)
            echo "artifact=dist/artifacts/${ART}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -lh dist/artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.artifact }}
          path: dist/artifacts/*
          retention-days: 14
          if-no-files-found: error

  ffi:
    name: FFI headers
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"; elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF#refs/tags/}"; else VER="v$(cat VERSION 2>/dev/null || echo "2.6.4")"; fi
          VER="${VER#v}"; echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build FFI tarball (reproducible)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          mkdir -p dist/.build/ffi
          cp go/ffi/ffi.h dist/.build/ffi/easytier.h 2>/dev/null || echo "/* ffi.h */" > dist/.build/ffi/easytier.h
          cp LICENSE dist/.build/ffi/LICENSE 2>/dev/null || true
          mkdir -p dist/.build/ffi/LICENSES
          cp LICENSES/LGPL-3.0-only.txt dist/.build/ffi/LICENSES/ 2>/dev/null || true
          find dist/.build/ffi -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          mkdir -p dist/artifacts
          (cd dist/.build/ffi && tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -czf "$GITHUB_WORKSPACE/dist/artifacts/easytier-ffi-v${VER}.tar.gz" .)
          ls -lh dist/artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: go-ffi
          path: dist/artifacts/*
          retention-days: 14

  docker:
    name: Docker images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"; elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF#refs/tags/}"; else VER="v$(cat VERSION 2>/dev/null || echo "2.6.4")"; fi
          VER="${VER#v}"; echo "version=$VER" >> "$GITHUB_OUTPUT"; echo "tag=v$VER" >> "$GITHUB_OUTPUT"
      - name: Download core linux artifacts for Docker context
        uses: actions/download-artifact@v4
        with:
          path: docker_context
          pattern: go-linux-*
          merge-multiple: true
      - name: List context
        run: |
          ls -lR docker_context || true
          ls -lR .github/workflows/Dockerfile || true
      - name: "Prepare Docker context (Go layout; supported arches only)"
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          mkdir -p docker_context_prepared
          # Prepare per-arch dirs expected by the Dockerfile. Only the two
          # supported Go arches are built; a missing archive is a hard error so
          # a placeholder binary can never enter the image.
          for arch in x86_64 aarch64; do
            case "$arch" in
              x86_64) tgz="easytier-go-v${VER}-linux-amd64.tar.gz" ;;
              aarch64) tgz="easytier-go-v${VER}-linux-arm64.tar.gz" ;;
            esac
            test -f "docker_context/$tgz" || { echo "missing $tgz"; ls -l docker_context; exit 1; }
            mkdir -p "docker_context_prepared/easytier-linux-${arch}"
            tar -xzf "docker_context/$tgz" -C "docker_context_prepared/easytier-linux-${arch}"
            test -f "docker_context_prepared/easytier-linux-${arch}/easytier-core" || {
              find "docker_context_prepared/easytier-linux-${arch}" -name "easytier-core" -type f \
                -exec cp {} "docker_context_prepared/easytier-linux-${arch}/" \;
            }
            test -x "docker_context_prepared/easytier-linux-${arch}/easytier-core" || chmod +x "docker_context_prepared/easytier-linux-${arch}/easytier-core"
            ls -lh "docker_context_prepared/easytier-linux-${arch}/"
          done
          cp docker_context/*.tar.gz docker_context_prepared/
          ls -R docker_context_prepared
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push, validate)
        uses: docker/build-push-action@v6
        with:
          context: ./docker_context_prepared
          file: .github/workflows/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: easytier/easytier-go:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save Docker context as artifact
        run: |
          mkdir -p dist/artifacts
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -czf "dist/artifacts/docker-context-v${{ steps.version.outputs.version }}.tar.gz" -C docker_context_prepared .
          ls -lh dist/artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: go-docker
          path: dist/artifacts/*
          retention-days: 14

  assemble:
    name: Assemble (SBOM, checksums, signatures, provenance)
    needs: [build, ffi, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="v$(cat VERSION 2>/dev/null || echo "2.6.4")"
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts (retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/artifacts
          # actions/download-artifact has no retry control. The 2026-09-23 run
          # failed here after 5 retries ("Unable to download artifact(s)"), so
          # use gh with an explicit retry loop and flatten the result.
          for attempt in 1 2 3 4 5; do
            rm -rf dist/download
            mkdir -p dist/download
            if gh run download "$GITHUB_RUN_ID" --pattern 'go-*' --dir dist/download; then
              count=$(find dist/download -type f | wc -l)
              if [ "$count" -gt 0 ]; then
                find dist/download -type f -exec cp {} dist/artifacts/ \;
                echo "downloaded $count files on attempt $attempt"
                break
              fi
            fi
            echo "artifact download attempt $attempt failed; retrying"
            sleep $((attempt * 5))
            if [ "$attempt" -eq 5 ]; then
              echo "::error::artifact download failed after 5 attempts"
              exit 1
            fi
          done

      - name: List artifacts
        run: ls -lhR dist/artifacts

      - name: Record deferred surfaces
        run: |
          cat > dist/artifacts/DEFERRED.md <<'EOF'
          # Deferred surfaces (2.6.4 Go release)

          This release contains only artifacts built from real sources:

          - easytier-go-* (core + CLI)
          - easytier-ffi-* (C header)
          - docker-context-* (linux/amd64 + linux/arm64)

          The following surfaces are **not** part of this release and no
          placeholder is shipped:

          - Android APKs / JNI shared libraries
          - Magisk module
          - OHOS HAR
          - GUI bundles (the Wails GUI is built by .github/workflows/gui.yml
            when the Go GUI backend is wired; it is not attached here yet)

          See docs/GO_REWRITE_TODOLIST.md §5.
          EOF

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist/artifacts
          # Supported 2.6.4 release surfaces: core, FFI headers, Docker context.
          # Deferred surfaces (Android/Magisk/OHOS/GUI) are deliberately absent.
          { for f in easytier-go-v* easytier-ffi-*.tar.gz docker-context-*.tar.gz; do [ -f "$f" ] && sha256sum "$f"; done; true; } | sort > SHA256SUMS
          if [ ! -s SHA256SUMS ]; then
            echo "No artifacts found for checksumming" && ls -l && exit 1
          fi
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          # per-artifact .sha256 sidecars (for every artifact)
          for f in easytier-go-v* easytier-ffi-*.tar.gz docker-context-*.tar.gz; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done || true
          ls -lh

      - name: SBOM (syft via anchore/sbom-action)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: dist/artifacts/sbom.spdx.json

      - name: SBOM CycloneDX (syft)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: dist/artifacts/sbom.cyclonedx.json

      - name: SBOM fallback check (go list)
        run: |
          (cd go && GOWORK=off go list -m all > ../dist/artifacts/sbom.go-list.txt) || true
          ls -lh dist/artifacts/sbom.*

      - name: Govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd go && GOWORK=off go vet ./... 2>&1 | head -n 20) || true
          (cd go && GOWORK=off govulncheck ./... 2>&1 | tee ../dist/artifacts/govulncheck.txt) || true
          cat dist/artifacts/govulncheck.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.6.0

      - name: Sign SHA256SUMS with cosign (keyless)
        run: |
          set -euo pipefail
          cd dist/artifacts
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
          cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/go-release.yml@.*" SHA256SUMS || echo "::warning::cosign verify failed (expected on fork/PR)"

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/artifacts/easytier-go-v*, dist/artifacts/easytier-ffi-*.tar.gz, dist/artifacts/docker-context-*.tar.gz"

      - name: Upload assembled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-release-bundle
          path: |
            dist/artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} (Go)
          files: |
            dist/artifacts/easytier-go-v*
            dist/artifacts/easytier-ffi-*.tar.gz
            dist/artifacts/docker-context-*.tar.gz
            dist/artifacts/DEFERRED.md
            dist/artifacts/SHA256SUMS*
            dist/artifacts/sbom.*
            dist/artifacts/govulncheck.txt

  # Optional SLSA provenance via reusable workflow (Level 3)
  # Uncomment to enable strict SLSA generation (requires tag push):
  # provenance:
  #   needs: assemble
  #   permissions:
  #     actions: read
  #     id-token: write
  #     contents: write
  #   uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
  #   with:
  #     base64-subjects: ${{ needs.assemble.outputs.hashes }}
  #     upload-assets: true
