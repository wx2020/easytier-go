name: EasyTier Mobile (Go JNI validation)

# The Rust/Tauri Android APK pipeline was removed with easytier-gui/src-tauri.
# The Go rewrite currently ships the Android core/JNI source only; APK and
# Magisk packaging are deferred (see docs/GO_REWRITE_TODOLIST.md §5).
# This workflow validates the real Go Android cross-build and JNI stubs, and
# uploads the arm64 core for downstream packaging experiments.

on:
  workflow_dispatch:
  push:
    branches: ["develop", "main", "feature", "releases/**"]
    paths:
      - "go/cmd/**"
      - "go/internal/**"
      - "go/jni/**"
      - "go/go.mod"
      - "go/go.sum"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: ["develop", "main", "feature"]
    paths:
      - "go/cmd/**"
      - "go/internal/**"
      - "go/jni/**"
      - "go/go.mod"
      - "go/go.sum"
      - ".github/workflows/mobile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Android arm64 core + JNI stubs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      GOWORK: off
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go/go.sum

      - name: Cross-build Android arm64 core and CLI
        env:
          GOOS: android
          GOARCH: arm64
        run: |
          mkdir -p ../dist/android-arm64
          go build -trimpath -o ../dist/android-arm64/easytier-core ./cmd/easytier-core
          go build -trimpath -o ../dist/android-arm64/easytier-cli ./cmd/easytier-cli
          file ../dist/android-arm64/easytier-core

      - name: JNI package (non-cgo stub path)
        run: |
          cd jni
          GOWORK=off go test ./...
          GOWORK=off GOOS=android GOARCH=arm64 go build ./...

      - name: Upload Android arm64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: easytier-android-arm64-go
          path: dist/android-arm64/*
          if-no-files-found: error

      - name: Deferred packaging notice
        run: |
          echo "APK, JNI .so (cgo/NDK) and Magisk packaging are deferred for 2.6.4." >> "$GITHUB_STEP_SUMMARY"
          echo "No placeholder APK or .so is produced by this workflow." >> "$GITHUB_STEP_SUMMARY"
